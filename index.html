<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X_UA_COMPATIBLE" content="edge">
        <title>DarkForm</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header id="mainHeader" class="headerStyle">
            <div class="container">
                <h1 id="headerTitle">Dark Form</h1>
            </div>
        </header>
        <div class="container">
            <div id="main" class="cardStyle">
                <h2 class="title">Add items</h2>
                <form id="form" class="formStyle">
                    <input type="text" class="inputStyle">
                    <input type="submit" class="submitStyle" value="Submit">
                </form>
                <h2 class="title">Items</h2>
                <ul id="items" class="listGroup">
                
                </ul>
            </div>
        </div>
    </body>
    <script src="script.js"></script>

</html>
